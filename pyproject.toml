[project]
name = "colfax-construction-safety"
version = "0.1.0"
description = "Did construction on Colfax Ave reduce severe crashes beyond the citywide trend?"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "polars==2.1.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "plotnine==0.15.8",
    # needed to run the notebook and to render the Quarto report
    "ipykernel==7.4.0",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false
